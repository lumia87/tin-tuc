name: Gom tin RSS

# Bản này KHÔNG commit data.json vào kho. Nó dựng ra thư mục _site rồi đưa thẳng
# lên GitHub Pages. Nhờ vậy hàng megabyte toàn văn không nằm lại trong lịch sử git.
#
# Cần đổi một lần trong Settings -> Pages: Source chọn "GitHub Actions"
# (thay cho "Deploy from a branch").

on:
  schedule:
    - cron: '0 */2 * * *'        # 2 giờ một lần (giờ UTC). Đổi thành '*/30 * * * *' nếu cần tươi hơn.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'fetch-feeds.mjs'
      - '.github/workflows/update-feeds.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Nhớ lại toàn văn đã bóc ở lần chạy trước -> mỗi lần chỉ tải bài thật sự mới
      - name: Khôi phục nội dung đã bóc
        uses: actions/cache@v5
        with:
          path: content
          key: noi-dung-${{ github.run_id }}
          restore-keys: noi-dung-

      - name: Cài thư viện
        run: npm install --no-save fast-xml-parser jsdom @mozilla/readability

      - name: Gom feed, bóc nội dung, ghi data.json
        run: node fetch-feeds.mjs index.html data.json

      - name: Dựng thư mục _site
        run: |
          mkdir -p _site
          cp index.html data.json _site/
          if [ -d content ]; then cp -r content _site/content; fi
          du -sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
